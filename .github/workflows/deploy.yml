# Автодеплой на свой сервер: push в main → сервер обновляет код и пересобирает сайт.
#
# Включается, когда в GitHub → Settings → Secrets and variables → Actions заданы:
#   Variables: DEPLOY_ENABLED = true
#   Secrets:   SERVER_HOST (IP сервера), SERVER_USER (например, ubuntu),
#              SERVER_SSH_KEY (приватный SSH-ключ для входа на сервер)
# Пока DEPLOY_ENABLED не задан, workflow просто пропускается.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Обновить и перезапустить сайт на сервере
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -e
            cd /opt/sfera
            git fetch --quiet origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
            docker compose ps
