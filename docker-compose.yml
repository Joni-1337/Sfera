# СФЕРА на своём сервере: сайт + PostgreSQL + Caddy (HTTPS).
# Все настройки — в файле .env рядом с этим файлом (образец: infra/server.env.example).
#
#   docker compose up -d --build   — собрать и запустить
#   docker compose logs -f app     — логи сайта

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sfera}
      POSTGRES_USER: ${POSTGRES_USER:-sfera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Порт базы наружу не открыт — она доступна только сайту внутри Docker.

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL}
        NEXT_PUBLIC_SUBSCRIPTION_PRICE_RUB: ${NEXT_PUBLIC_SUBSCRIPTION_PRICE_RUB:-}
        NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID:-}
        NEXT_PUBLIC_YANDEX_VERIFICATION: ${NEXT_PUBLIC_YANDEX_VERIFICATION:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_TAWK_PROPERTY_ID: ${NEXT_PUBLIC_TAWK_PROPERTY_ID:-}
        NEXT_PUBLIC_TAWK_WIDGET_ID: ${NEXT_PUBLIC_TAWK_WIDGET_ID:-}
        NEXT_PUBLIC_LEGAL_NAME: ${NEXT_PUBLIC_LEGAL_NAME:-}
        NEXT_PUBLIC_LEGAL_INN: ${NEXT_PUBLIC_LEGAL_INN:-}
        NEXT_PUBLIC_LEGAL_PHONE: ${NEXT_PUBLIC_LEGAL_PHONE:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sfera}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sfera}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-sfera}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sfera}?schema=public
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    # Ограничение памяти, чтобы сайт не занял весь сервер
    mem_limit: 1g

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Задайте SITE_DOMAIN в .env}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
